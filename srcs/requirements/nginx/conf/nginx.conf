# Probably use auto in real containers
worker_processes 1;

# number of clients each worker can handle -> upo to 1024 clients
events
{
	worker_connections 1024;
}

http
{
	include			mime.types;						# loads file type mappings (e.g., .html -> text/html)
	default_type	application/octet-stream;		# used if unknown file types are encountered
	sendfile		on;								# use sendfile() syscall when serving files

	server
	{
		listen 443 ssl;
		server_name ${DOMAIN_NAME}

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_certificate     /etc/nginx/ssl/cert.pem;
		ssl_certificate_key /etc/nginx/ssl/key.pem;

		root /var/www/html;							# location of the website files (wordpress container downloads it here)
		index index.php index.html index.htm;		# default files (in order) to serve when a directory is requested 
													#e.g. https://localhost:443/ -> index, then index.php, then index.html, then index.htm
		location /
		{
			try_files $uri $uri/ /index.php?$args;	# try to serve the requested URI as a file or directory, if it doesn't exist, pass the request to index.php with the original query string
		}

		location ~ \.php$						# activated when a .php file is requested. Pass the request to a PHP engine
		{
			resolver 127.0.0.11 valid=10s;		# use Docker DNS resolver to resolve the wordpress container to its IP address
			include fastcgi_params;				# loads predefined CGI variables needed by php-fpm
			set $php_upstream wordpress:9000;	
			fastcgi_pass $php_upstream;			# passes request to container: wordpress using port 9000
			fastcgi_index index.php;			# default PHP file if none is specified
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;	# tells php-fpm the path of the requested PHP file (e.g., /var/www/html/index.php)
		}

		error_page 404 /404.html;				# if a file is not found, serve the 404.html file located in the root directory (e.g., /var/www/html/404.html)
    }
}
